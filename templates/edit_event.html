<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Event</title>
  <link rel="stylesheet" href="/static/admin.css">
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h2>Admin Panel</h2>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/admin/users">👥 Manage Users</a>
    <a href="/admin/create-event">➕ Create Event</a>
    <a href="/admin/events" class="active">📅 Manage Events</a>
    <a href="/logout">🚪 Logout</a>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="header">
      <h1>Edit Event</h1>
      <p>Update event details</p>
    </div>

    <div class="card">
      <form method="POST">

        <div class="form-group">
          <label>Event Title</label>
          <input type="text" name="title" value="{{ event.title }}" required>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea name="description" rows="4">{{ event.description }}</textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ event.date }}" required>
          </div>

          <div class="form-group">
            <label>Time</label>
            <input type="time" name="time" value="{{ event.time }}" required>
          </div>
        </div>

        <div class="form-group">
          <label>Venue</label>
          <input type="text" name="venue" value="{{ event.venue }}" required>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn-primary">Save Changes</button>
          <a href="/admin/events" class="btn">Cancel</a>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
